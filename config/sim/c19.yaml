# Simulator parameters for corridor c19. Fixed by hand (ADR 0001): nothing here is fitted to data.
# Scheduling nominals (used by emtra_common.timetable; the schedule is built with constants).
link_mean_s: 90      # must equal the mean of link_mean_by_link_s
dwell_mean_s: 20     # nominal dwell used only to build the schedule

# In-motion time between consecutive stops: lognormal, one mean per link (11 links S01-S02 ... S11-S12).
link_mean_by_link_s: [70, 85, 100, 110, 95, 75, 105, 90, 120, 60, 80]
link_cv: {early: 0.20, am_peak: 0.25, midday: 0.20, pm_peak: 0.25, evening: 0.20}

# Dispatch deviation at the first stop: Normal(mu, sigma) seconds, truncated below.
dispatch: {mu_s: 20, sigma_s: 45, min_s: -30}
preroll_s: 180       # a bus is visible (approaching its first stop) this long before departing

# Dwell d = d0 + b*boarders + a*alighters (H3 [40]).
dwell: {d0_s: 8.0, b_s_per_pax: 2.5, a_s_per_pax: 1.5}

# Demand: Poisson. rate(stop, line, group) = scale * board_weight[stop] * line_factor[line]
# * profile[group]; `scale` is calibrated so the peak load of the busiest line is peak_load_target
# of its capacity (fluid model, am_peak).
peak_load_target: 0.65
board_weight_per_h: [110, 90, 100, 80, 70, 90, 100, 80, 60, 50, 40, 30]   # S01..S12
alight_fraction: [0.0, 0.08, 0.10, 0.10, 0.12, 0.15, 0.12, 0.15, 0.15, 0.20, 0.25, 0.30]
line_factor: {"19": 1.0, "C1": 0.8, "170": 0.6}
profile: {early: 0.5, am_peak: 1.0, midday: 0.6, pm_peak: 0.95, evening: 0.4}

# Predictor (emitted time_left_s): sum of mean links minus elapsed, times bias, lognormal noise
# per (bus, poll). Does not look at the future.
predictor:
  bias: 0.95
  noise_cv: 0.05
  dwell_pred_s: 20
  nominal_speed_mps: 5.0
  max_time_left_s: 1800
  max_buses_per_line: 2

emitter: {poll_interval_s: 30, p_poll_fail: 0.002, stopset_version: 1}

# Fault catalogue by severity [low, medium, high].
faults:
  breakdown: {duration_s: [600, 1800, null]}              # null = rest of the day
  slowdown: {factor: [1.3, 1.6, 2.2], duration_s: [900, 1800, 2700]}
  dispatch_delay: {headway_fraction: [0.5, 0.75, 1.0]}
  demand_surge: {factor: [2, 3, 5], duration_s: [1200, 1200, 1200]}
  blocked_segment: {duration_s: [600, 1200, 1800]}
