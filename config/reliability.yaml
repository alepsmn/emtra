# ReliabilityMonitor parameters (F3 + F9). See docs/plan/WP-04-monitor.md.
allowed_lateness_s: 150      # a band closes when the watermark passes its end by this much (the Monitor does not read never_fulfilled, so the ingestor grace does not constrain it)
min_headways: 6              # c_vh needs at least this many pooled headways in the band
min_arrivals: 3              # OTP needs at least this many arrivals in the band
otp_match_window_s: {early: 300, late: 1800}   # a scheduled arrival matches delta in [-early, +late]
otp_on_time_s: 300           # on time: -otp_early_tolerance_s <= delay <= this
otp_early_tolerance_s: 60    # an arrival up to this much ahead of schedule is still on time
blocked_min_scheduled: 2     # blocked_segment: no arrival of the line in the segment, >= this many scheduled
close_after_bands: 2         # consecutive inside bands that close an alert
sigma_floor: 0.02            # lower bound of the baseline sigma0 when computing z
arl0_target: 2000            # in-control average run length, in bands (tune_detectors.py)
ewma: {lam: 0.2, L: {cvh: 3.95, otp: 5.28}}      # L per indicator is written by tune_detectors.py
cusum: {k: 0.5, h: {cvh: 7.47, otp: 10.36}}      # h per indicator is written by tune_detectors.py
shewhart: {z_max: {cvh: 5.08, otp: 7.25}}  # comparison only (K8); written by tune_detectors.py
# Recommendation loop (WP8)
recommendation_budget_s: 120     # wall-clock time the ActionPlanner has to answer (divided by the world's speed); then the fallback
rerequest_distance_delta: 0.05   # ask again only if distance_to_range moved more than this since the last request
state_stale_s: 180               # a bus with no estimate or arrival for this long is not in the CorridorState
